name: Build UF02 OpenClash sysupgrade

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_VERSION: v25.12.5
  OPENCLASH_FEED: src-git-full openclash https://github.com/vernesong/OpenClash.git^c3a33c1d3407956fdf8f0e0b7c1a4c52e6ad9593

jobs:
  build:
    name: generic-uf02 / OpenWrt 25.12.5
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout build definition
        uses: actions/checkout@v4

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo -E apt-get -qq update
          sudo -E ./devenv/dependencies.sh
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Clone fixed OpenWrt source and load UF02 support
        run: |
          git clone https://git.openwrt.org/openwrt/openwrt.git openwrt
          git -C openwrt checkout "$OPENWRT_VERSION"
          chmod +x apply_patches.sh
          ./apply_patches.sh openwrt
          mv msm89xx openwrt/target/linux/msm89xx
          mv packages openwrt/package/msm8916

      - name: Add fixed OpenClash feed and generate configuration
        run: |
          cd openwrt
          printf '\n%s\n' "$OPENCLASH_FEED" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../diffconfig_uf02 .config
          make defconfig
          make download -j8
          find dl -size -1024c -delete

      - name: Build generic-uf02 only
        run: |
          cd openwrt
          make -j"$(nproc)" V=s

      - name: Verify Firewall4 TProxy and sysupgrade payload
        run: |
          set -euo pipefail
          target_dir="openwrt/bin/targets/msm89xx/msm8916"
          image=$(find "$target_dir" -maxdepth 1 -type f -name '*generic-uf02-squashfs-sysupgrade.bin' -print -quit)
          manifest=$(find "$target_dir" -maxdepth 1 -type f -name '*generic-uf02*.manifest' -print -quit)
          test -n "$image"
          test -s "$image"
          test -n "$manifest"
          test -s "$manifest"

          kernel_config=$(find openwrt/build_dir -path '*/linux-*/linux-*/.config' -print -quit)
          test -n "$kernel_config"
          grep -qx 'CONFIG_NF_TPROXY_IPV4=m' "$kernel_config"
          grep -qx 'CONFIG_NF_TPROXY_IPV6=m' "$kernel_config"
          grep -qx 'CONFIG_NFT_TPROXY=m' "$kernel_config"
          grep -q '^kmod-nft-tproxy ' "$manifest"
          grep -q '^luci-app-openclash ' "$manifest"
          tar tf "$image" | grep -Eq '/CONTROL$'
          tar tf "$image" | grep -Eq '/kernel$'
          tar tf "$image" | grep -Eq '/root$'

          sha256sum "$image" > "$target_dir/sha256sums-uf02-openclash"
          mkdir -p artifacts
          cp "$image" "$manifest" "$target_dir/sha256sums-uf02-openclash" artifacts/

      - name: Upload verified sysupgrade image
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.5-generic-uf02-openclash-sysupgrade
          path: artifacts/
          if-no-files-found: error
